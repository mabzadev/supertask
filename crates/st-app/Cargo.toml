[package]
name = "st-app"
description = "Supertask client in eframe/egui, for the web (WASM) and the desktop."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
st-api = { path = "../st-api" }
st-core = { path = "../st-core" }
# glow instead of the default wgpu: a much smaller WASM and no GPU-specific
# native dependencies; system_fonts is left out because it needs fontconfig.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
ehttp = "0.7.3"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to the installed wasm-bindgen-cli, which trunk uses to generate the JS glue.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3"
web-sys = { version = "0.3.107", features = ["Window", "Location", "Document", "HtmlCanvasElement", "Element"] }

[dev-dependencies]
egui_kittest = "0.37.0"
base64 = "0.23.1"
