[package]
name = "st-core"
description = "Supertask domain types: fields, views, applications, cell values and their display."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Pure logic only: this crate is compiled into the egui app and into the Worker,
# so it must not depend on egui, on an HTTP client or on an async runtime.
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

