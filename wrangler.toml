name = "supertask"
main = "src/index.ts"
compatibility_date = "2025-05-18"
compatibility_flags = ["nodejs_compat"]
account_id = "8706f1b6760214ae04dad8c10116be36"

# The web app (Pages on task.mabza.dev) calls the API on its own origin, so the
# browser sends no CORS preflight before each new URL. workers.dev stays for
# API clients, links already shared and the MCP endpoints handed out.
workers_dev = true
routes = [
  { pattern = "task.mabza.dev/api/*", zone_name = "mabza.dev" },
  { pattern = "task.mabza.dev/ws/*", zone_name = "mabza.dev" },
  { pattern = "task.mabza.dev/mcp/*", zone_name = "mabza.dev" },
]

[limits]
cpu_ms = 300000

# ── Placement ────────────────────────────────────────────────────────────────
# Most requests make several sequential D1 queries. Running the Worker next to
# the D1 primary (WEUR, served from CDG — check with
# `wrangler d1 execute supertask-db --remote --command "select 1" --json`)
# cuts each round trip from ~20 ms to a few ms. Smart mode needs steady traffic
# from several locations before it moves anything, so the hint is explicit.
[placement]
region = "aws:eu-west-3"

# ── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "supertask-db"
database_id = "5f980046-3c6a-4b8d-ace6-445ae052e079"

# ── KV Namespace ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "743f96cb8cb44d2e850598f385de3b61"

# ── R2 Bucket (Supertask dedicated file storage) ──────────────────────────────
[[r2_buckets]]
binding = "FILES"
bucket_name = "supertask-files"

# ── Cloudflare Images Transformations ────────────────────────────────────────
[images]
binding = "IMAGES"

# ── Cloudflare Browser Rendering ────────────────────────────────────────────────
[browser]
binding = "BROWSER"
# wrangler dev uses the same remote browser as production: a local Chromium
# can't start its sandbox on this server.
remote = true

# ── Workers AI and Vectorize Assistant Knowledge Base ────────────────────────
[ai]
binding = "AI"

[[vectorize]]
binding = "KNOWLEDGE_BASE"
index_name = "supertask-assistant-docs"

# ── Queues ───────────────────────────────────────────────────────────────────
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "supertask-jobs"

[[queues.consumers]]
queue = "supertask-jobs"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "supertask-jobs-dlq"

# Messages land here when the Worker died on every delivery; the consumer
# settles their job so it does not wait forever (src/queue/handler.ts).
[[queues.consumers]]
queue = "supertask-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# ── Durable Objects ──────────────────────────────────────────────────────────
[durable_objects]
bindings = [
  { name = "WORKSPACE_ROOM", class_name = "WorkspaceRoomDO" },
  { name = "CONTENT_ROOM", class_name = "ContentRoomDO" },
  { name = "MCP_SESSION", class_name = "McpSessionDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["McpSessionDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ContentRoomDO"]

# ── Cron Triggers ────────────────────────────────────────────────────────────
[triggers]
crons = [
  "*/5 * * * *",   # consolidated background scheduler
]

# ── Environment Variables ─────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
JWT_ACCESS_TTL_MINUTES = "10"
JWT_REFRESH_TTL_DAYS = "7"
PUBLIC_URL = "https://supertask.mbza.workers.dev"
PUBLIC_WEB_FRONTEND_URL = "https://task.mabza.dev"
MEDIA_URL = "https://supertask.mbza.workers.dev/media/"
BATCH_ROWS_SIZE_LIMIT = "200"
SUPERTASK_SERVE_FILES_THROUGH_BACKEND = "true"
SUPERTASK_SERVE_FILES_THROUGH_BACKEND_PERMISSION = "DISABLED"
SUPERTASK_SERVE_FILES_THROUGH_BACKEND_EXPIRE_SECONDS = "0"
# Secrets set via: wrangler secret put <NAME>
# Required secrets:
#   SECRET_KEY
#   JWT_SIGNING_KEY
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS
#   PUBLIC_URL

# ── Local dev overrides ──────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"
