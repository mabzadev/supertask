name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — contrôles et tests
    runs-on: [self-hosted, supertask]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types et les formules
        run: npm run check

      - name: Exécuter les tests backend
        run: npm test

  frontend:
    name: Frontend — tests et build Cloudflare
    runs-on: [self-hosted, supertask]
    timeout-minutes: 60
    env:
      SENTRY_DISABLED: "true"
      CI: "true"
      # Bound parallel Nuxt test environments so the shared server keeps headroom.
      EXTRA_VITEST_PARAMS: --maxWorkers=8
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Yarn 1
        run: npm install --global yarn@1.22.22

      - name: Préparer les modules partagés
        run: |
          ln -sfn ../../frontend/node_modules enterprise/web-frontend/node_modules
          ln -sfn ../../frontend/node_modules premium/web-frontend/node_modules

      - name: Installer les dépendances frontend
        run: yarn --cwd frontend install --frozen-lockfile --non-interactive

      - name: Exécuter les tests frontend
        run: yarn --cwd frontend test

      - name: Exécuter les tests Enterprise
        run: yarn --cwd frontend test:enterprise

      - name: Générer le site Cloudflare
        run: yarn --cwd frontend generate
        env:
          NODE_ENV: production
          # Same origin as the web app: the Worker serves /api, /ws and /mcp there.
          NUXT_PUBLIC_PUBLIC_BACKEND_URL: https://task.mabza.dev
          NUXT_PUBLIC_PUBLIC_WEB_FRONTEND_URL: https://task.mabza.dev
          NUXT_PUBLIC_BASEROW_EMBEDDED_SHARE_URL: https://task.mabza.dev
          NUXT_PUBLIC_MEDIA_URL: https://supertask.mbza.workers.dev/media/

      - name: Conserver le site généré
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Déploiement Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: [self-hosted, supertask]
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations D1
        run: npx wrangler d1 migrations apply DB --remote

      - name: Déployer le Worker
        run: npx wrangler deploy

      - name: Récupérer le site généré
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Déployer le site Pages
        run: npx wrangler pages deploy frontend/dist --project-name=supertask-web --branch=main --commit-hash=${{ github.sha }}
